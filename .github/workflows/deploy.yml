name: Deploy with Secrets
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets into Script
        run: |
          # Replace the WebApp URL placeholder
          sed -i "s|INSERT_SECRET_URL_HERE|${{ secrets.VITE_WEBAPP_URL }}|g" script.js
          # Replace the auth token placeholder
          sed -i "s|AUTH_TOKEN_PLACEHOLDER|${{ secrets.AUTH_TOKEN }}|g" script.js

      - name: Validate URL Injection
        run: |
          if grep -q "INSERT_SECRET_URL_HERE" script.js; then
            echo "::error::Secret injection failed - URL placeholder still exists"
            exit 1
          fi
          echo "URL injection validated successfully"

      - name: Validate Auth Token Injection
        run: |
          if grep -q "AUTH_TOKEN_PLACEHOLDER" script.js; then
            echo "::error::Secret injection failed - auth token placeholder still exists"
            exit 1
          fi
          echo "Auth token injection validated successfully"

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build-and-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
